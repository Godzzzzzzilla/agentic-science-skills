# pdf-layout-parse resource manifest
skill: pdf-layout-parse
version: 1.2.0
entry: SKILL.md
github: https://github.com/Godzzzzzzilla/agentic-science-skills/tree/main/skills/pdf-layout-parse
files:
  - path: SKILL.md
    role: agent-facing workflow (pipeline, engine behaviors, review pass, failure routes)
  - path: README.md
    role: usage, methods, scope, limits
  - path: manifest.yaml
    role: resource inventory
  - path: GITHUB_URL.txt
    role: public GitHub link
  - path: scripts/run.py
    role: engine — multi-backend extraction, row-empty column detection, band separation, run splitting, table row grouping, evidence-gated continuation merges, contract-true result.json
  - path: scripts/audit.py
    role: one-command recheck — re-opens the PDF, verifies block fidelity, column-major order, table cells, coverage honesty
  - path: scripts/selftest.py
    role: synthetic 2-column PDF (continuation + table + bands + footnote + formula) end-to-end test
  - path: references/output-contract.md
    role: result.json schema + block semantics + audit guarantees
constraints:
  utf8_text_files: 8
  max_bytes_per_file: 500KB
  total_bytes: well under 2MB
  symlinks: none
  runtime_deps: python3 stdlib (PDF backends probed: pymupdf > pdfminer > pdftotext)
